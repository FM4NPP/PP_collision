# Mamba Track Finding (Downstream) Configuration
# Anonymized for publication

# Default configuration
default: &default
  # === Data Paths (UPDATE THESE) ===
  data_root: /global/cfs/cdirs/m4722/NPFM/data/pp_12M_mmap
  stat_dir: /global/cfs/cdirs/m4722/NPFM/data/stats
  data_root_train: /mldata/sli/sphenix_fm/pp_100k_mmap-particle_ids/
  data_root_test: /mldata/sli/sphenix_fm/pp_100k_mmap-particle_ids/ 
  downstream_dir: /pscratch/sd/d/dpark1/NPFN/test
  checkpoint_dir: /pscratch/sd/d/dpark1/NPFN/test

  # === Data Configuration ===
  data_version: pp_12M
  batch_size: 4                          # Smaller batch for downstream
  limit_data: true
  limit_size: 100                        # Can use smaller subset for quick testing
  log_to_screen: false
  max_epochs: 200
  n_data_idx: 1000000
  n_eval_steps: 1000
  num_data_workers: 4
  
  # === legacy (not used) ===
  nleave: 1e10
  order: EPR
  len_chunk: 512
  portion: 0.2
  chunk_training: false
  return_reg_test: false
  max_gt_classes: 150
  space_filling_order: false
  space_filling_curve: z # hilbert
  grad_clip_value: 0.1
  rep_aaai: false
  loss_reweight: false
  ablate_loss_scale: false
  save_checkpoint: true

  # === Optimization ===
  max_lr: 0.0001
  min_lr: 0.00001
  first_cycle_steps: 200
  warmup_steps: 20

  # === Model Configuration ===
  base_dim: 256
  embed_dim: 256
  group_size: 8
  init_std: 0.025
  model_version: downstream_v1

  # === Embedding Configuration ===
  embed_method: add
  pe_method: nerf

  # === Downstream Head Configuration ===
  # [FIX B1] track_finding_trainer.py reads params.downstream_dropout, which was defined
  # nowhere in this file -> AttributeError on every downstream run.
  downstream_dropout: 0.1
  num_heads_backbone: 4
  num_heads_decoder: 2
  num_heads_encoder: 2
  num_embedder_layers: 0
  use_attention_head: true

  # === Training Configuration ===
  continue_from_best: true
  valid_batch_size: 1

  # === Loss Weights (tune based on data) ===
  loss_matched_ce_weight: 0.5
  loss_unmatched_ce_weight: 0.1
  loss_dice_weight: 1
  loss_focal_weight: 30

  # === Data Processing ===
  return_reg: false
  # [B19] track_finding_trainer.py unpacks TUPLES from the dataloader (lines ~435/799/923),
  # so tracking requires return_dict: false. point_classification_trainer.py consumes
  # DICTS and needs return_dict: true. Do not share one value across both tasks.
  return_dict: false
  voxelize: true

# ============================================================================
# Mamba 5M Downstream Configuration
# ============================================================================
mamba_5m_downstream:
  <<: *default
  embed_dim: 256
  num_layers_backbone: 12
  d_state: 16
  klen: 30
  # [FIX] `dropout` is the FROZEN BACKBONE's dropout and must stay 0.0 for the released
  # checkpoints; the trainable head's rate is `downstream_dropout` (see &default).
  dropout: 0.0
  max_lr: 0.0001
  min_lr: 0.00001
  # [FIX B10] the released checkpoints are Mamba2. Note that both entrypoints end with
  # `params.mambaversion = args.mambaversion` and --mambaversion defaults to "mamba2",
  # so this key was silently overridden anyway -- the advertised mamba1 never ran.
  mambaversion: mamba2

  # === Pretrained Checkpoint ===
  # [FIX B11] HF: https://huggingface.co/FM4NPP/PP_collision
  # NOTE the naming trap: pp_nerf_m1_k30.ckpt is width 256 / 5.3M params, which the
  # PAPER calls m3. Repo "m1" != paper "m1".
  pretrained_ckpt: ./checkpoints/pp_nerf_m1_k30.ckpt

# ============================================================================
# Mamba2 5M Downstream Configuration
# ============================================================================
mamba2_5m_downstream:
  <<: *default
  embed_dim: 256
  num_layers_backbone: 12
  d_state: 128
  headdim: 64
  ngroups: 1
  klen: 30
  dropout: 0.1
  max_lr: 0.0001
  min_lr: 0.00001
  mambaversion: mamba2

  # === Pretrained Checkpoint (UPDATE THIS) ===
  pretrained_ckpt: /global/cfs/cdirs/m4722/NPFM/pretrained_models/pp_m3_k5.ckpt

# ============================================================================
# Training from Scratch (No Pretrain) - For Comparison
# ============================================================================
mamba_5m_scratch:
  <<: *default
  embed_dim: 256
  num_layers_backbone: 12
  d_state: 16
  klen: 30
  dropout: 0.1
  max_lr: 0.0001
  min_lr: 0.00001
  mambaversion: mamba1
  # No pretrained_ckpt - trains from random initialization
