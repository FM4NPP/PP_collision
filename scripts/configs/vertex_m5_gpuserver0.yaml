# Vertex evaluation of the m5 backbone and its track head on gpuserver0:
#   python eval_vertex_reconstruction.py --run_config ../../scripts/configs/vertex_m5_gpuserver0.yaml [--max_eval_events 5000 ...]
#   (from train/downstream)
# Keys are eval_vertex_reconstruction.py's options without --; relative paths are relative to this file.
# ~ is the home directory of whoever runs it.

# backbone: the m5 architecture block of the model YAML, and its weights
config: d9_m5_k30_p20
pretrained_ckpt: /zfs0/fm4npp/pretrained/pp_nerf_m5_k30.ckpt

# track head d9_m5_k30_p20_nerf_tracking_head_d70000_2_seed42_checkpoint.pth, found by its name parts in
# checkpoint_dir (or set checkpoint: to the full path instead)
track_config: d9_m5_k30_p20
checkpoint_dir: /zfs0/fm4npp/downstream      # FILL IN: the directory holding the track-head checkpoint
eventnumber: 70000            # the head's training size (part of its name)
run_num: 2
seed: 42

# what to evaluate and where to write it
max_eval_events: 1000         # events evaluated and written to the per-point CSV
eval_batch_size: 8            # events per backbone call: same results as 1 (padding is ignored), slightly faster
root_dir: ~/vertex_eval        # runs in <backbone>/<track head>/: data/ (CSV), logs/, metrics/ (JSON), files vertex_eval_e<events>_<N>

# VertexHead: field, ACTS inputs and fit settings
detector: sphenix_gpuserver0.yaml   # site detector file (scripts/run/vertexing.sh setup makes it)
vertex_device: cuda           # VertexHead's device (it runs beside the backbone)
vertex_chunk_events: 128      # events per VertexHead call
